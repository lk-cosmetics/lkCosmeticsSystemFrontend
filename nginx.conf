server {
    listen 80;
    server_name _;

    # Allow larger multipart/form-data uploads (logos, documents) via proxy.
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Avoid buffering large multipart uploads to disk in nginx.
        proxy_request_buffering off;
    }

    location /media/ {
        # Serve media files from shared volume with fallback to backend.
        # This is production best-practice: local storage is fast, backend is fallback.
        # Files uploaded to backend automatically sync to this volume.
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # If file not found locally, proxy to backend (fallback mechanism)
        error_page 404 = @media_backend;
    }
    
    location @media_backend {
        # Fallback: proxy to backend if file not in volume (ensures no 404s)
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy external WordPress/WooCommerce product images through this server
    # so the browser never hits CORS / hotlink / mixed-content issues.
    # Frontend rewrites:
    #   https://therapybylk.com/wp-content/uploads/2024/11/img.png
    #   → /wp-proxy/wp-content/uploads/2024/11/img.png
    location /wp-proxy/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # Strip /wp-proxy prefix → /wp-content/uploads/…
        rewrite ^/wp-proxy/(.*)$ /$1 break;

        proxy_pass https://therapybylk.com;
        proxy_ssl_server_name on;
        proxy_set_header Host therapybylk.com;
        proxy_set_header Referer "";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        # Cache proxied images locally for 7 days
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
